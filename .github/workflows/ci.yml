name: CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ─── Maven build ────────────────────────────────────────────────────────────
  maven-build:
    name: Maven – build & test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Unit tests
        run: mvn -B test

      - name: Package + integration tests
        run: mvn -B verify

      - name: Upload surefire / failsafe reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maven-test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/

      - name: Upload Maven fat JAR
        uses: actions/upload-artifact@v4
        with:
          name: devlens-jar-maven
          path: target/devlens.jar

  # ─── Gradle build ───────────────────────────────────────────────────────────
  gradle-build:
    name: Gradle – build & test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew test --no-daemon

      - name: Build fat JAR + integration tests
        run: ./gradlew check --no-daemon

      - name: Upload Gradle test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-test-reports
          path: build/reports/tests/

      - name: Upload Gradle fat JAR
        uses: actions/upload-artifact@v4
        with:
          name: devlens-jar-gradle
          path: build/libs/devlens.jar

  # ─── Docker build (runs after both build jobs pass on main) ─────────────────
  docker-build:
    name: Docker – image build
    runs-on: ubuntu-latest
    needs: [ maven-build, gradle-build ]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      # Use the Gradle-produced JAR for the Docker image
      - name: Download Gradle fat JAR
        uses: actions/download-artifact@v4
        with:
          name: devlens-jar-gradle
          path: build/libs/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.gradle
          push: false
          tags: devlens:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

